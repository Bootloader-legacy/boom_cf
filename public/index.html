<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>boom</title>
<style>
:root{--bg:#f6f3ef;--card:#fffaf7;--text:#292522;--muted:#887d74;--accent:#d889a6;--bubble:#f0e8e3;--border:#e5ddd6;--wall:none}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;background-image:var(--wall);background-size:cover;background-position:center;background-attachment:fixed}.app{width:min(760px,100%);height:100dvh;margin:auto;background:#fffaf7e8;backdrop-filter:blur(10px);display:flex;flex-direction:column}header{height:64px;padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}header b{font-size:23px}#roomLabel{margin-left:auto;font-size:11px;color:var(--muted);background:var(--bubble);padding:7px 9px;border-radius:9px}.icon{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:9px}.screen{flex:1;display:flex;align-items:center;justify-content:center;padding:22px}.menu{width:min(390px,100%)}h1{font-size:42px;margin:0 0 5px}h2{margin:0 0 8px}.sub{color:var(--muted);font-size:13px;margin-bottom:25px}.actions{display:grid;gap:10px}.actions button,.primary{border:0;border-radius:14px;padding:14px;background:var(--accent);color:white;font-weight:700;font-size:15px}.secondary{background:var(--card)!important;color:var(--text)!important;border:1px solid var(--border)!important}.panel{display:none;width:min(390px,100%);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px}.panel.show{display:block}.panel input{width:100%;padding:13px;border:1px solid #dcd2ca;border-radius:12px;background:var(--card);color:var(--text);margin:7px 0 12px}.row{display:flex;gap:8px}.row>*{flex:1}.back{border:0;background:none;color:var(--muted);padding:6px 0;margin-bottom:10px}.hint{font-size:12px;color:var(--muted);line-height:1.5}.code{font-size:22px;letter-spacing:3px;text-align:center;padding:12px;background:var(--bubble);border-radius:12px;margin:12px 0}.chat{display:none;flex:1;flex-direction:column;min-height:0}.messages{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}.msg{max-width:82%;padding:10px 12px;border-radius:16px;background:var(--bubble)}.mine{align-self:flex-end;background:#ecd4df}.name{font-size:11px;font-weight:700;color:var(--muted)}.time{font-size:9px;color:var(--muted);margin-top:4px}.photo{max-width:100%;border-radius:12px;margin-top:5px;display:block}.system{text-align:center;color:var(--muted);font-size:11px}.composer{display:flex;gap:7px;padding:9px;border-top:1px solid var(--border);padding-bottom:calc(9px + env(safe-area-inset-bottom))}.composer input{flex:1;min-width:0;padding:12px;border:1px solid #dcd2ca;border-radius:13px;background:var(--card)}.send,.photoBtn{border:0;border-radius:13px;padding:11px 13px;background:var(--accent);color:white}.photoBtn{background:var(--bubble);color:var(--text)}#file{display:none}.settings{position:absolute;right:10px;top:58px;width:min(300px,calc(100% - 20px));background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;display:none;z-index:5;box-shadow:0 12px 30px #0002}.settings.show{display:block}.swatches{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0 12px}.sw{width:42px;height:36px;border:2px solid var(--border);border-radius:9px}.wall{height:42px;border-radius:9px;border:2px solid var(--border);margin:3px}.wallrow{display:grid;grid-template-columns:repeat(2,1fr)}@media(min-width:761px){.app{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
</style></head><body><div class="app"><header><b>boom</b><span id="roomLabel">—</span><button class="icon" id="gear">⚙</button></header>
<div class="screen" id="home"><div class="menu"><h1>boom</h1><div class="sub">private little room for your people.</div><div class="actions"><button id="createBtn">Buat Room</button><button class="secondary" id="joinBtn">Masuk Room</button></div></div><div class="panel" id="createPanel"><button class="back">← Kembali</button><h2>Buat Room</h2><div class="hint">Buat kode room lalu bagikan ke temanmu.</div><input id="createName" maxlength="24" placeholder="Nama kamu"><button class="primary" id="make">Buat & Masuk</button><div class="code" id="newCode">—</div><div class="hint">Simpan kode ini. Siapa pun yang punya kode bisa masuk.</div></div><div class="panel" id="joinPanel"><button class="back">← Kembali</button><h2>Masuk Room</h2><input id="joinName" maxlength="24" placeholder="Nama kamu"><input id="joinCode" maxlength="32" placeholder="Kode room"><button class="primary" id="enter">Masuk</button></div></div>
<div class="chat" id="chat"><div class="messages" id="messages"></div><form class="composer" id="form"><label class="photoBtn">＋<input id="file" type="file" accept="image/*"></label><input id="text" maxlength="1000" autocomplete="off" placeholder="Tulis pesan..."><button class="send">Kirim</button></form></div>
<div class="settings" id="settings"><b>Tampilan</b><div class="hint">Tema</div><div class="swatches" id="swatches"></div><div class="hint">Wallpaper</div><div class="wallrow" id="walls"></div></div></div>
<script>
const $=x=>document.getElementById(x);let ws,name,room;const themes=[['#d889a6','#f6f3ef','#292522','#f0e8e3'],['#5795c9','#eef5fb','#1d2935','#dceaf6'],['#8b7bd8','#15151b','#f4f2fa','#282733'],['#6d9d7b','#eef4ef','#233028','#dce9df']];const walls=['','linear-gradient(135deg,#f7d6e3,#d8e9f7)','linear-gradient(135deg,#171827,#45405c)','linear-gradient(135deg,#f4c6a5,#d98ca8)'];
function panel(p){$('createPanel').classList.remove('show');$('joinPanel').classList.remove('show');if(p)$(p).classList.add('show')}$('createBtn').onclick=()=>panel('createPanel');$('joinBtn').onclick=()=>panel('joinPanel');document.querySelectorAll('.back').forEach(b=>b.onclick=()=>panel(null));
$('make').onclick=()=>{name=$('createName').value.trim()||'Guest';room=Math.random().toString(36).slice(2,8).toUpperCase();$('newCode').textContent=room;connect()};$('enter').onclick=()=>{name=$('joinName').value.trim()||'Guest';room=$('joinCode').value.trim().toUpperCase();if(room)connect()};
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?room='+encodeURIComponent(room)+'&name='+encodeURIComponent(name));ws.onopen=()=>{ $('home').style.display='none';$('chat').style.display='flex';$('roomLabel').textContent=room };ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='message')add(m,m.name===name);else if(m.type==='history')m.history.forEach(x=>add(x,x.name===name));else if(m.type==='system')system(m.text)};ws.onclose=()=>system('Terputus dari room.')}
function add(m,mine){let d=document.createElement('div');d.className='msg '+(mine?'mine':'');let n=document.createElement('div');n.className='name';n.textContent=m.name;d.append(n);if(m.photo){let im=new Image();im.src=m.photo;im.className='photo';d.append(im)}if(m.text){let t=document.createElement('div');t.textContent=m.text;d.append(t)}let tm=document.createElement('div');tm.className='time';tm.textContent=new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});d.append(tm);$('messages').append(d);$('messages').scrollTop=$('messages').scrollHeight}function system(t){let d=document.createElement('div');d.className='system';d.textContent=t;$('messages').append(d)}
$('form').onsubmit=e=>{e.preventDefault();let t=$('text').value.trim();if(!t||!ws||ws.readyState!==1)return;ws.send(JSON.stringify({type:'chat',text:t}));$('text').value=''};$('file').onchange=()=>{let f=$('file').files[0];if(!f||f.size>1.5*1024*1024){alert('Foto maksimal 1.5 MB.');$('file').value='';return}let r=new FileReader();r.onload=()=>{ws.send(JSON.stringify({type:'chat',text:'',photo:r.result}))};r.readAsDataURL(f)};
$('gear').onclick=()=>{$('settings').classList.toggle('show')};themes.forEach(t=>{let b=document.createElement('button');b.className='sw';b.style.background=t[0];b.onclick=()=>{document.documentElement.style.setProperty('--accent',t[0]);document.documentElement.style.setProperty('--bg',t[1]);document.documentElement.style.setProperty('--text',t[2]);document.documentElement.style.setProperty('--bubble',t[3])};$('swatches').append(b)});walls.forEach(w=>{let b=document.createElement('button');b.className='wall';b.style.background=w||'var(--bg)';b.onclick=()=>document.documentElement.style.setProperty('--wall',w?' '+w:'none');$('walls').append(b)});
</script></body></html>
